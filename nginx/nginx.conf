worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    # ============================================================
    # UPSTREAM — список инстансов Catalog для балансировки
    # ============================================================
    upstream catalog_upstream {
        # round-robin по умолчанию — запросы чередуются
        server catalog-1:8000 max_fails=2 fail_timeout=10s;
        server catalog-2:8000 max_fails=2 fail_timeout=10s;
    }

    # ============================================================
    # СЕРВЕР
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------------
        # /auth/* → Auth Service
        # --------------------------------------------------------
        location /auth/ {
            # Убираем префикс /auth перед отправкой в сервис
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://auth-1:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------------------
        # /catalog/* → Catalog Service (балансировка)
        # --------------------------------------------------------
        location /catalog/ {
            # Убираем префикс /catalog
            rewrite ^/catalog/(.*)$ /$1 break;
            proxy_pass http://catalog_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------------------
        # Health check самого Nginx
        # --------------------------------------------------------
        location /nginx-health {
            return 200 "nginx is alive\n";
            add_header Content-Type text/plain;
        }
    }
}