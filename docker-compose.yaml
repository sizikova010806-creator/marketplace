networks:
  marketplace-net:
    driver: bridge

services:
  # ============================================================
  # CONSUL — Service Discovery
  # ============================================================
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client 0.0.0.0 -ui
    networks:
      - marketplace-net

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth:
    build: ./auth_service
    image: auth-service:latest
    container_name: auth-1
    environment:
      - INSTANCE_NAME=auth-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - JWT_SECRET=super-secret-key-change-me
    depends_on:
      - consul
    networks:
      - marketplace-net

  # ============================================================
  # CATALOG SERVICE — инстанс 1
  # ============================================================
  catalog-1:
    build: ./catalog_service
    image: catalog-service:latest
    container_name: catalog-1
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - marketplace-net

  # ============================================================
  # CATALOG SERVICE — инстанс 2
  # ============================================================
  catalog-2:
    build: ./catalog_service
    image: catalog-service:latest
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - marketplace-net

  # ============================================================
  # ORDER SERVICE
  # ============================================================
  order:
    build: ./order_service
    image: order-service:latest
    container_name: order-1
    environment:
      - INSTANCE_NAME=order-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    networks:
      - marketplace-net

  # ============================================================
  # GRAPHQL GATEWAY
  # ============================================================
  graphql-gateway:
    build: ./graphql_gateway
    image: graphql-gateway:latest
    container_name: graphql-gateway
    environment:
      - INSTANCE_NAME=graphql-gateway-1
      - PORT=8000
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - CATALOG_URL=http://catalog-1:8000
      - ORDER_URL=http://order-1:8000
    depends_on:
      - consul
      - catalog-1
      - order
    networks:
      - marketplace-net

  # ============================================================
  # API GATEWAY (Nginx)
  # ============================================================
  gateway:
    build: ./nginx
    image: nginx-gateway:latest
    container_name: gateway
    ports:
      - "8080:80"
    depends_on:
      - auth
      - catalog-1
      - catalog-2
      - order
      - graphql-gateway
    networks:
      - marketplace-net
      
      